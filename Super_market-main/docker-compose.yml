version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0.44
    container_name: supermarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supermarket}
      MYSQL_USER: ${MYSQL_USER:-supermarket_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supermarket_pass}
      TZ: Asia/Kolkata
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./SuperMarket Backend/create_super_admin_bcrypt.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - supermarket-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # Spring Boot Backend
  backend:
    build:
      context: ./SuperMarket Backend
      dockerfile: Dockerfile
    container_name: supermarket-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-supermarket}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-supermarket_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-supermarket_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-this-in-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Email Configuration
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-test}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-test}
      # Razorpay Configuration
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_xxxxx}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-xxxxxx}
      # Subscription Configuration
      SUBSCRIPTION_TRIAL_DAYS: ${SUBSCRIPTION_TRIAL_DAYS:-5}
      SUBSCRIPTION_BASIC_PRICE: ${SUBSCRIPTION_BASIC_PRICE:-99900}
      SUBSCRIPTION_STANDARD_PRICE: ${SUBSCRIPTION_STANDARD_PRICE:-299900}
      SUBSCRIPTION_PREMIUM_PRICE: ${SUBSCRIPTION_PREMIUM_PRICE:-599900}
      FILE_UPLOAD_DIR: /app/uploads
      TZ: ${TZ:-Asia/Kolkata}
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - supermarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # React Frontend with Nginx
  frontend:
    build:
      context: ./SuperMarket Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: supermarket-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      TZ: Asia/Kolkata
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - supermarket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  supermarket-network:
    driver: bridge
