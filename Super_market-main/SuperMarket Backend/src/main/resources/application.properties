spring.application.name=SMMS-Backend
# Use MySQL database for production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===============================
# DATABASE
# ===============================
# MySQL Database Configuration
# Default credentials for local development:
# URL: jdbc:mysql://localhost:3306/supermarket
# Username: root
# Password: Tsarit@12345
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supermarket}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Tsarit@12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# HIKARI CONNECTION POOL (Ultra-Fast)
# ===============================
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=SMMSHikariPool

# ===============================
# HIBERNATE PERFORMANCE
# ===============================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# H2 Database Configuration (commented out)
