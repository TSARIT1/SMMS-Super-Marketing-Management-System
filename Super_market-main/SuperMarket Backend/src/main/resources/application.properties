# ===============================
# SUBSCRIPTION PLANS
# ===============================
subscription.trial.days=5
# Automatically start a free trial when a user registers (true/false)
subscription.trial.auto-enabled=true
subscription.basic.price=6000
subscription.standard.price=12000
subscription.premium.price=25000
subscription.enterprise.price=50000

# ===============================
# TOMCAT LIMITS
# ===============================
server.tomcat.max-part-count=10000
server.tomcat.max-http-form-post-size=104857600
server.tomcat.max-swallow-size=104857600

# ===============================
# THYMELEAF (DISABLE CHECK)
# ===============================
spring.thymeleaf.check-template-location=false

# Frontend URL for links in emails and notifications
frontend.base.url=http://localhost:3000
