# ============================================
# HIGH SCALE CONFIGURATION FOR 10M USERS
# Optimized for 60ms response time
# ============================================

spring.application.name=TsarIT-SuperMarket-Backend
spring.profiles.active=highscale

# ===============================
# DATABASE - HIKARI CONNECTION POOL
# Optimized for high concurrency
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-primary-service:3306/supermarket}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Tsarit@12345}

# HikariCP - High Performance Connection Pool
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=500
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=SuperMarketHikariPool
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# Read Replica Configuration
spring.datasource.read-replica.url=${SPRING_DATASOURCE_READ_REPLICA_URL:jdbc:mysql://mysql-replica-service:3306/supermarket}
spring.datasource.read-replica.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.read-replica.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.read-replica.password=${SPRING_DATASOURCE_PASSWORD:Tsarit@12345}
spring.datasource.read-replica.hikari.maximum-pool-size=50
spring.datasource.read-replica.hikari.minimum-idle=10

# JPA/Hibernate Optimizations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=500
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=2048
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.javax.cache.uri=classpath:ehcache.xml

# ===============================
# REDIS - DISTRIBUTED CACHE
# ===============================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis-service}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=100ms
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=50
spring.data.redis.lettuce.pool.min-idle=20
spring.data.redis.lettuce.pool.max-wait=50ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=smms:
spring.cache.redis.use-key-prefix=true

# ===============================
# TOMCAT - HIGH PERFORMANCE
# ===============================
server.tomcat.max-threads=500
server.tomcat.min-spare-threads=50
server.tomcat.max-connections=20000
server.tomcat.accept-count=200
server.tomcat.executor=custom
server.tomcat.max-http-form-post-size=10MB
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=10000

# ===============================
# JVM OPTIMIZATIONS (via environment)
# ===============================
# JAVA_OPTS=-Xms4g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:G1HeapRegionSize=32m -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -XX:+UseCompressedOops -XX:+UseCompressedClassPointers -XX:+AlwaysPreTouch -XX:+UseTLAB -XX:+ResizeTLAB -XX:InitiatingHeapOccupancyPercent=35 -XX:ConcGCThreads=4 -XX:ParallelGCThreads=8 -XX:+UseNUMA -XX:+UseParallelGC -XX:NewRatio=1 -XX:SurvivorRatio=8

# ===============================
# ACTUATOR - MONITORING
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readiness.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# ===============================
# LOGGING - OPTIMIZED
# ===============================
logging.level.root=WARN
logging.level.in.main=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# MAIL CONFIGURATION
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.username=${MAIL_USERNAME:no-reply@example.com}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.file-size-threshold=2KB

# ===============================
# RAZORPAY PAYMENT GATEWAY
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_live_Rz8vO7gI0lkWTk}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:eoF7UrrVeVZD3JTSzd9k5KD5}
razorpay.currency=INR
razorpay.company.name=Tsar IT SuperMarket

# ===============================
# SUBSCRIPTION PLANS
# ===============================
subscription.trial.days=5
subscription.trial.auto-enabled=true
subscription.basic.price=6000
subscription.standard.price=12000
subscription.premium.price=25000
subscription.enterprise.price=50000

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:supermarket-jwt-secret-key-minimum-256-bits-long-for-security}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===============================
# RATE LIMITING
# ===============================
rate-limit.enabled=true
rate-limit.requests-per-minute=300
rate-limit.requests-per-hour=10000
rate-limit.burst-capacity=500

# ===============================
# PERFORMANCE MONITORING
# ===============================
performance.slow-query-threshold-ms=100
performance.slow-request-threshold-ms=200
performance.log-slow-requests=true

# ===============================
# FRONTEND URL
# ===============================
frontend.base.url=${FRONTEND_BASE_URL:https://supermarket.com}

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.check-template-location=false

# ===============================
# JACKSON JSON
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.parser.allow-comments=true
spring.jackson.parser.allow-trailing-comma=true