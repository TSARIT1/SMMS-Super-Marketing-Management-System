# ========================================
# TSAR-IT SuperMarket - Production Configuration
# ========================================

# Application Info
spring.application.name=SuperMarketBackend
server.port=${SERVER_PORT:8080}

# ========================================
# DATABASE CONFIGURATION
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/supermarket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:supermarket_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:supermarket_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# JWT SECURITY CONFIGURATION
# ========================================
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========================================
# RAZORPAY PAYMENT GATEWAY (LIVE)
# ========================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_live_test}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret}

# Subscription Plans (in INR paise - 1 INR = 100 paise)
razorpay.plan.free-trial.amount=0
razorpay.plan.basic.amount=99900
razorpay.plan.standard.amount=299900
razorpay.plan.premium.amount=599900
razorpay.plan.enterprise.amount=999900

# Trial Period
subscription.free-trial.days=5

# ========================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ========================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:test}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Email From Address
email.from=noreply@tsar-it.com

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.in.main=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - [%thread] %-5level %logger{36} - %msg%n

# ========================================
# SERVER CONFIGURATION
# ========================================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-binding-errors=always
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ========================================
# MULTIPART FILE UPLOAD
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# ACTUATOR ENDPOINTS (Production Monitoring)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ========================================
# PRODUCTION OPTIMIZATIONS
# ========================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
