# ============================================
# Ingress with CDN Integration for 10M Users
# Global Load Balancing & SSL
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supermarket-ingress
  namespace: supermarket
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    
    # SSL Configuration with Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Performance optimizations for 60ms response
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "256k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    
    # Connection settings optimized for high traffic
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    
    # Rate limiting for DDoS protection
    nginx.ingress.kubernetes.io/limit-connections: "500"
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    
    # Enable CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://supermarket.com https://www.supermarket.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    
    # Security headers for SEO and Security
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      
      # SEO-friendly error pages
      error_page 404 /index.html;
      error_page 500 502 503 504 /50x.html;
    
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
    
    # Session affinity for better user experience
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "balanced"
    nginx.ingress.kubernetes.io/session-cookie-name: "SMSESSION"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    
    # Enable sticky sessions for WebSocket
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    
    # Global rate limiting
    nginx.ingress.kubernetes.io/global-rate-limit: "10000"
    nginx.ingress.kubernetes.io/global-rate-limit-window: "1m"
    
    # Use HTTP/2 for better performance
    nginx.ingress.kubernetes.io/use-http2: "true"
    
    # Enable Brotli compression
    nginx.ingress.kubernetes.io/server-snippet: |
      brotli on;
      brotli_comp_level 6;
      brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
      
      # Enable HTTP/3 (QUIC) for ultra-fast connections
      listen 443 quic reuseport;
      listen 443 ssl;
      http2 on;
      add_header Alt-Svc 'h3=":443"; ma=86400';
    
    # Cache configuration
    nginx.ingress.kubernetes.io/server-snippet: |
      proxy_cache_path /var/cache/nginx/proxy levels=2:2 keys_zone=ingress_cache:500m max_size=5g inactive=60m use_temp_path=off;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_valid 200 2m;
      proxy_cache_valid 404 30s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_ignore_headers Set-Cookie;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - supermarket.com
        - www.supermarket.com
        - api.supermarket.com
        - cdn.supermarket.com
      secretName: supermarket-tls-secret
  rules:
    # Main domain - Frontend
    - host: supermarket.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    # WWW redirect - Frontend
    - host: www.supermarket.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    # API subdomain
    - host: api.supermarket.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
    # CDN subdomain for static assets
    - host: cdn.supermarket.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
---
# Certificate Issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@supermarket.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Certificate Issuer for Staging
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@supermarket.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Global Load Balancer Service (for multi-region)
apiVersion: v1
kind: Service
metadata:
  name: supermarket-lb
  namespace: supermarket
  annotations:
    # Cloud provider load balancer annotations
    # For AWS:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # For GCP:
    # cloud.google.com/load-balancer-type: "External"
    # For Azure:
    # service.beta.kubernetes.io/azure-load-balancer-resource-group: "supermarket-rg"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: http3
      port: 443
      targetPort: 443
      protocol: UDP
  selector:
    app: nginx-ingress