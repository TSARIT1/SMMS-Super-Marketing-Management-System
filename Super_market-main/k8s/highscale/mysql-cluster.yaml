# ============================================
# MySQL Cluster for 10M Users
# Primary-Replica with Read/Write Splitting
# ============================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-primary
  namespace: supermarket
  labels:
    app: mysql
    role: primary
    tier: database
spec:
  serviceName: mysql-primary-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      role: primary
  template:
    metadata:
      labels:
        app: mysql
        role: primary
        tier: database
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/database
                operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - mysql
            topologyKey: kubernetes.io/hostname
      containers:
      - name: mysql
        image: mysql:8.0.44
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supermarket-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: supermarket-config
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: supermarket-config
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supermarket-secrets
              key: MYSQL_PASSWORD
        args:
        # High Performance MySQL Configuration
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --default-authentication-plugin=mysql_native_password
        # Connection Settings for High Traffic
        - --max_connections=5000
        - --max_connect_errors=10000
        - --connect_timeout=10
        - --wait_timeout=600
        - --interactive_timeout=600
        # InnoDB Optimizations for 60ms Response
        - --innodb_buffer_pool_size=8G
        - --innodb_buffer_pool_instances=8
        - --innodb_log_file_size=1G
        - --innodb_log_buffer_size=256M
        - --innodb_flush_log_at_trx_commit=2
        - --innodb_flush_method=O_DIRECT
        - --innodb_io_capacity=2000
        - --innodb_io_capacity_max=4000
        - --innodb_read_io_threads=8
        - --innodb_write_io_threads=8
        - --innodb_thread_concurrency=0
        - --innodb_lock_wait_timeout=30
        - --innodb_rollback_on_timeout=1
        - --innodb_file_per_table=1
        - --innodb_compression_level=6
        # Query Cache (disabled for MySQL 8.0+ performance)
        - --query_cache_size=0
        - --query_cache_type=0
        # Binary Logging for Replication
        - --log-bin=mysql-bin
        - --binlog_format=ROW
        - --binlog_cache_size=1M
        - --max_binlog_size=500M
        - --expire_logs_days=7
        - --sync_binlog=0
        - --server-id=1
        - --log-slave-updates=ON
        - --gtid_mode=ON
        - --enforce_gtid_consistency=ON
        # Slow Query Logging
        - --slow_query_log=1
        - --slow_query_log_file=/var/log/mysql/slow.log
        - --long_query_time=0.1
        - --log_queries_not_using_indexes=1
        # Performance Schema
        - --performance_schema=ON
        - --performance_schema_instrument='%=ON'
        # Thread Pool
        - --thread_pool_size=32
        - --thread_pool_max_threads=1000
        resources:
          requests:
            cpu: "4000m"
            memory: "16Gi"
          limits:
            cpu: "8000m"
            memory: "32Gi"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-log
          mountPath: /var/log/mysql
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -p$(MYSQL_ROOT_PASSWORD)
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -p$(MYSQL_ROOT_PASSWORD)
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: mysql-log
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-primary-service
  namespace: supermarket
  labels:
    app: mysql
    role: primary
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: mysql
    role: primary
---
# MySQL Read Replicas (3 replicas for read scaling)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica
  namespace: supermarket
  labels:
    app: mysql
    role: replica
    tier: database
spec:
  serviceName: mysql-replica-service
  replicas: 3
  selector:
    matchLabels:
      app: mysql
      role: replica
  template:
    metadata:
      labels:
        app: mysql
        role: replica
        tier: database
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mysql
              topologyKey: kubernetes.io/hostname
      containers:
      - name: mysql
        image: mysql:8.0.44
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supermarket-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: supermarket-config
              key: MYSQL_DATABASE
        args:
        # Replica Optimized Configuration
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --max_connections=3000
        - --innodb_buffer_pool_size=4G
        - --innodb_buffer_pool_instances=4
        - --innodb_log_file_size=512M
        - --innodb_flush_log_at_trx_commit=2
        - --innodb_flush_method=O_DIRECT
        - --read_only=ON
        - --server-id=2
        - --log-bin=mysql-bin
        - --binlog_format=ROW
        - --gtid_mode=ON
        - --enforce_gtid_consistency=ON
        - --relay_log=relay-bin
        - --relay_log_recovery=ON
        - --slow_query_log=1
        - --long_query_time=0.1
        resources:
          requests:
            cpu: "2000m"
            memory: "8Gi"
          limits:
            cpu: "4000m"
            memory: "16Gi"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica-service
  namespace: supermarket
  labels:
    app: mysql
    role: replica
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: mysql
    role: replica
---
# MySQL Read Replica Service (Headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica-headless
  namespace: supermarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: mysql
    role: replica