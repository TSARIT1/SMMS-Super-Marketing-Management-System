# ============================================
# Redis Cluster for 10M Users
# High Performance Distributed Cache
# ============================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: supermarket
  labels:
    app: redis
    tier: cache
spec:
  serviceName: redis-service
  replicas: 6
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - redis
              topologyKey: kubernetes.io/hostname
      containers:
      - name: redis
        image: redis:7.4-alpine
        ports:
        - containerPort: 6379
          name: redis
        - containerPort: 16379
          name: cluster
        command:
        - redis-server
        args:
        - --cluster-enabled yes
        - --cluster-config-file /data/nodes.conf
        - --cluster-node-timeout 5000
        - --cluster-announce-ip $(POD_IP)
        - --cluster-announce-port 6379
        - --cluster-announce-bus-port 16379
        # Performance Optimizations
        - --maxmemory 4gb
        - --maxmemory-policy allkeys-lru
        - --maxmemory-samples 10
        - --tcp-backlog 511
        - --tcp-keepalive 300
        - --timeout 0
        - --save ""
        - --appendonly no
        # Latency Optimizations for 60ms Response
        - --io-threads 4
        - --io-threads-do-reads yes
        - --disable-thp yes
        - --slowlog-log-slower-than 10000
        - --slowlog-max-len 128
        - --latency-monitor-threshold 50
        # Network Optimizations
        - --bind 0.0.0.0
        - --protected-mode no
        - --port 6379
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "1000m"
            memory: "5Gi"
          limits:
            cpu: "2000m"
            memory: "8Gi"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.62.0
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis://localhost:6379"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: supermarket
  labels:
    app: redis
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  - port: 16379
    targetPort: 16379
    name: cluster
  selector:
    app: redis
---
# Redis Client Service (for non-cluster aware clients)
apiVersion: v1
kind: Service
metadata:
  name: redis-client
  namespace: supermarket
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis
---
# Redis Sentinel for High Availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: supermarket
  labels:
    app: redis-sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - redis-sentinel
              topologyKey: kubernetes.io/hostname
      containers:
      - name: sentinel
        image: redis:7.4-alpine
        ports:
        - containerPort: 26379
          name: sentinel
        command:
        - redis-sentinel
        - /etc/redis/sentinel.conf
        volumeMounts:
        - name: sentinel-config
          mountPath: /etc/redis
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: sentinel-config
        configMap:
          name: redis-sentinel-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: supermarket
data:
  sentinel.conf: |
    port 26379
    sentinel monitor supermarket-master redis-service 6379 2
    sentinel down-after-milliseconds supermarket-master 5000
    sentinel failover-timeout supermarket-master 10000
    sentinel parallel-syncs supermarket-master 1
    sentinel deny-scripts-reconfig yes
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-service
  namespace: supermarket
spec:
  type: ClusterIP
  ports:
  - port: 26379
    targetPort: 26379
    name: sentinel
  selector:
    app: redis-sentinel