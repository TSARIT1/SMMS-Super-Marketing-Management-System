apiVersion: v1
kind: Secret
metadata:
  name: supermarket-secrets
  namespace: supermarket
type: Opaque
stringData:
  # MySQL Credentials - CHANGE THESE IN PRODUCTION
  MYSQL_ROOT_PASSWORD: "your-secure-root-password-here"
  MYSQL_PASSWORD: "your-secure-db-password-here"
  
  # JWT Secret - CHANGE THIS IN PRODUCTION (use a strong 256-bit key)
  JWT_SECRET: "your-256-bit-secret-key-change-this-in-production-use-openssl-rand-base64-32"
  
  # Email Credentials
  MAIL_USERNAME: "your-email@gmail.com"
  MAIL_PASSWORD: "your-app-password-here"
  
  # Razorpay Credentials
  RAZORPAY_KEY_ID: "rzp_live_xxxxx"
  RAZORPAY_KEY_SECRET: "your-razorpay-secret-here"
  
  # Database connection string
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/supermarket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "supermarket_user"
  SPRING_DATASOURCE_PASSWORD: "your-secure-db-password-here"
  
  # Redis Password
  REDIS_PASSWORD: "your-redis-password-here"
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: supermarket
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded docker config - generate with:
  # kubectl create secret docker-registry docker-registry-secret --docker-server=<registry> --docker-username=<user> --docker-password=<password> --namespace=supermarket --dry-run=client -o yaml
  .dockerconfigjson: e30K