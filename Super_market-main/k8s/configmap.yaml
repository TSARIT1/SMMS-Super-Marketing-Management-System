apiVersion: v1
kind: ConfigMap
metadata:
  name: supermarket-config
  namespace: supermarket
data:
  # Database Configuration
  MYSQL_DATABASE: "supermarket"
  MYSQL_USER: "supermarket_user"
  SPRING_PROFILES_ACTIVE: "prod"
  
  # Backend Configuration
  SERVER_PORT: "8080"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  
  # JWT Configuration
  JWT_EXPIRATION_MS: "86400000"
  
  # Email Configuration
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  
  # Subscription Configuration
  SUBSCRIPTION_TRIAL_DAYS: "5"
  SUBSCRIPTION_BASIC_PRICE: "99900"
  SUBSCRIPTION_STANDARD_PRICE: "299900"
  SUBSCRIPTION_PREMIUM_PRICE: "599900"
  
  # File Upload
  FILE_UPLOAD_DIR: "/app/uploads"
  
  # Timezone
  TZ: "Asia/Kolkata"
  
  # Logging
  LOGGING_LEVEL: "INFO"
  
  # Frontend Environment
  VITE_API_BASE_URL: "https://api.supermarket.com"
  VITE_API_URL: "https://api.supermarket.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: supermarket
data:
  nginx.conf: |
    worker_processes auto;
    worker_rlimit_nofile 65535;
    
    events {
        worker_connections 4096;
        multi_accept on;
        use epoll;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        keepalive_requests 10000;
        reset_timedout_connection on;
        
        # Buffer settings for high traffic
        client_body_buffer_size 16K;
        client_header_buffer_size 1k;
        client_max_body_size 50M;
        large_client_header_buffers 4 8k;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
        
        # Gzip compression - Ultra performance
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types
            application/atom+xml
            application/geo+json
            application/javascript
            application/x-javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rdf+xml
            application/rss+xml
            application/vnd.ms-fontobject
            application/wasm
            application/x-web-app-manifest+json
            application/xhtml+xml
            application/xml
            font/eot
            font/otf
            font/ttf
            image/bmp
            image/svg+xml
            text/cache-manifest
            text/calendar
            text/css
            text/javascript
            text/markdown
            text/plain
            text/xml
            text/vcard
            text/vnd.rim.location.xloc
            text/vtt
            text/x-component
            text/x-cross-domain-policy;
        
        # Brotli compression (if available)
        brotli on;
        brotli_comp_level 6;
        brotli_types text/plain text/css application/javascript application/json application/xml;
        
        # Rate limiting zones
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
        limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
        limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
        
        # Upstream backends with load balancing
        upstream backend_cluster {
            least_conn;
            server backend-service:8080 weight=5;
            keepalive 32;
        }
        
        # Map for caching
        map $sent_http_content_type $expires {
            default                    off;
            text/html                  epoch;
            text/css                   max;
            application/javascript     max;
            ~image/                    30d;
            ~font/                     30d;
        }
        
        server {
            listen 80;
            server_name localhost;
            root /usr/share/nginx/html;
            index index.html;
            
            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            
            # HSTS for HTTPS
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            
            # Content Security Policy
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.supermarket.com https://checkout.razorpay.com; frame-src https://api.sandbox.razorpay.com https://api.razorpay.com;" always;
            
            # Cache control with expires
            expires $expires;
            
            # Open file cache for static assets
            open_file_cache max=10000 inactive=30s;
            open_file_cache_valid 60s;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;
            
            # Static assets with aggressive caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff";
                access_log off;
                
                # Enable stale cache
                proxy_cache_valid 200 302 10m;
                proxy_cache_valid 404 1m;
            }
            
            # API proxy with rate limiting and load balancing
            location /api {
                limit_req zone=api burst=200 nodelay;
                limit_conn conn_limit 50;
                
                proxy_pass http://backend_cluster;
                proxy_http_version 1.1;
                
                # Connection pooling
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                
                # Timeouts
                proxy_connect_timeout 5s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
                
                # Buffer settings
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
                proxy_busy_buffers_size 8k;
            }
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # Robots.txt for SEO
            location = /robots.txt {
                allow all;
                log_not_found off;
                access_log off;
            }
            
            # Sitemap for SEO
            location = /sitemap.xml {
                allow all;
                log_not_found off;
                access_log off;
            }
            
            # React Router - serve index.html for all routes
            location / {
                limit_req zone=general burst=100 nodelay;
                
                try_files $uri $uri/ /index.html;
                
                # No caching for index.html
                location = /index.html {
                    add_header Cache-Control "no-cache, no-store, must-revalidate";
                    add_header Pragma "no-cache";
                    add_header Expires "0";
                }
            }
            
            # Error pages
            error_page 404 /index.html;
            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
            }
        }
    }